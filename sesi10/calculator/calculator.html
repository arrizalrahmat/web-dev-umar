<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="calculator.css" />
    <title>Calculator</title>
  </head>
  <body class="bg-light">
    <div
      class="container min-vh-100 d-flex align-items-center justify-content-center">
      <div class="card shadow calculator">
        <div class="card-body p-3">
          <!-- Display -->
          <input
            type="text"
            id="display"
            class="form-control form-control-lg text-end fs-2 mb-3 calculator-display"
            readonly />

          <!-- Keypad -->
          <div class="row g-2">
            <div class="col-3">
              <button
                class="btn btn-secondary w-100 py-3"
                id="btn-clear"
                data-action="clear"
                onclick="clearCharacter()">
                C
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-secondary w-100 py-3"
                id="btn-delete"
                data-action="delete"
                onclick="deleteCharacter()">
                ⌫
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-secondary w-100 py-3"
                id="btn-percent"
                data-action="percent"
                onclick="addCharacter('%')">
                %
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-warning w-100 py-3"
                id="btn-divide"
                data-operator="/"
                onclick="addCharacter('/')">
                /
              </button>
            </div>

            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-7"
                data-number="7"
                onclick="addCharacter('7')">
                7
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-8"
                data-number="8"
                onclick="addCharacter('8')">
                8
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-9"
                data-number="9"
                onclick="addCharacter('9')">
                9
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-warning w-100 py-3"
                id="btn-multiply"
                data-operator="*"
                onclick="addCharacter('*')">
                ×
              </button>
            </div>

            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-4"
                data-number="4"
                onclick="addCharacter('4')">
                4
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-5"
                data-number="5"
                onclick="addCharacter('5')">
                5
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-6"
                data-number="6"
                onclick="addCharacter('6')">
                6
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-warning w-100 py-3"
                id="btn-subtract"
                data-operator="-"
                onclick="addCharacter('-')">
                −
              </button>
            </div>

            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-1"
                data-number="1"
                onclick="addCharacter('1')">
                1
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-2"
                data-number="2"
                onclick="addCharacter('2')">
                2
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-3"
                data-number="3"
                onclick="addCharacter('3')">
                3
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-warning w-100 py-3"
                id="btn-add"
                data-operator="+"
                onclick="addCharacter('+')">
                +
              </button>
            </div>

            <div class="col-6">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-0"
                data-number="0"
                onclick="addCharacter('0')">
                0
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-dot"
                data-number="."
                onclick="addCharacter('.')">
                .
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-primary w-100 py-3"
                id="btn-equals"
                data-action="equals"
                onclick="calculate()">
                =
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- untuk connect javascript ke html -->
    <script src="calculator.js"></script>
  </body>
</html>
