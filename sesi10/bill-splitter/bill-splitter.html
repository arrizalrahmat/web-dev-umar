<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="bill-splitter.css" />
    <title>Bill Splitter</title>
  </head>
  <body class="bg-light">
    <div
      class="container min-vh-100 d-flex align-items-center justify-content-center">
      <div class="card shadow bill-splitter">
        <div class="card-body p-3">
          <!-- Bill display -->
          <label
            for="display"
            class="form-label text-muted small mb-1">
            Bill amount
          </label>
          <input
            type="text"
            id="display"
            class="form-control form-control-lg text-end fs-2 mb-3 bill-display"
            value="0"
            readonly />

          <!-- Keypad -->
          <div class="row g-2 mb-3" id="keypad">
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-7"
                data-number="7">
                7
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-8"
                data-number="8">
                8
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-9"
                data-number="9">
                9
              </button>
            </div>

            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-4"
                data-number="4">
                4
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-5"
                data-number="5">
                5
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-6"
                data-number="6">
                6
              </button>
            </div>

            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-1"
                data-number="1">
                1
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-2"
                data-number="2">
                2
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-3"
                data-number="3">
                3
              </button>
            </div>

            <div class="col-4">
              <button
                class="btn btn-secondary w-100 py-3"
                id="btn-clear"
                data-action="clear">
                C
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-light border w-100 py-3"
                id="btn-0"
                data-number="0">
                0
              </button>
            </div>
            <div class="col-4">
              <button
                class="btn btn-secondary w-100 py-3"
                id="btn-delete"
                data-action="delete">
                ⌫
              </button>
            </div>
          </div>

          <!-- Tip -->
          <label class="form-label text-muted small mb-1"
            >Tip</label
          >
          <div class="row g-2 mb-3" id="tip-group">
            <div class="col-3">
              <button
                class="btn btn-outline-warning w-100"
                id="tip-0"
                data-tip="0">
                0%
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-outline-warning w-100"
                id="tip-5"
                data-tip="5">
                5%
              </button>
            </div>
            <div class="col-3">
              <button
                class="btn btn-warning w-100 active"
                id="tip-10"
                data-tip="10">
                10%
              </button>
            </div>
            <div class="col-3">
              <input
                type="number"
                id="tip-custom"
                class="form-control text-center h-100"
                placeholder="%"
                min="0" />
            </div>
          </div>

          <!-- People -->
          <label class="form-label text-muted small mb-1"
            >Split between</label
          >
          <div class="input-group mb-3" id="people-group">
            <button
              class="btn btn-outline-secondary px-4"
              id="people-minus"
              data-people="-1">
              −
            </button>
            <input
              type="text"
              id="people"
              class="form-control text-center fs-5 fw-semibold"
              value="1"
              readonly />
            <button
              class="btn btn-outline-secondary px-4"
              id="people-plus"
              data-people="1">
              +
            </button>
          </div>

          <!-- Result -->
          <div
            class="bg-dark text-light rounded p-3 result">
            <div
              class="d-flex justify-content-between small">
              <span>Tip</span>
              <span id="tip-amount">Rp 0</span>
            </div>
            <div
              class="d-flex justify-content-between small">
              <span>Total</span>
              <span id="total">Rp 0</span>
            </div>
            <hr class="border-secondary my-2" />
            <div
              class="d-flex justify-content-between align-items-baseline">
              <span>Per person</span>
              <span id="per-person" class="fs-3 fw-bold"
                >Rp 0</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
